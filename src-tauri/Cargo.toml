[package]
name = "mc-launcher"
version = "0.1.0"
description = "A fast, lightweight Minecraft Java Edition launcher"
authors = ["launcher"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# Avoid name collisions with bins and folders
[[bin]]
name = "mc-launcher"
path = "src/main.rs"

# Headless install driver used by the CI smoke job. Exercises the
# exact same code path as the GUI (AppState::bootstrap, mods::install_for_instance,
# launcher::prepare::prepare) but driven by CLI args so the GUI can
# be launched afterwards to screenshot the installed instance.
[[bin]]
name = "install-cli"
path = "src/bin/install_cli.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri runtime
tauri = { version = "2.1" }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-shell = "2.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "json"] }

# Filesystem / hashing
sha1_smol = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Errors
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Time / UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Path utilities
dirs = "5"
which = "6"

# Regex (for argument parsing)
regex = "1"

# Base64 / URL encoding (auth)
base64 = "0.22"
url = "2"
urlencoding = "2"
rand = "0.8"

# System info
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Cross-platform keyring for token storage (optional, gated)
keyring = { version = "3", optional = true, features = ["windows-native", "linux-native", "apple-native"] }

# Concurrency
parking_lot = "0.12"
dashmap = "6"

[features]
# Default features - release
default = ["custom-protocol", "keyring"]
custom-protocol = ["tauri/custom-protocol"]
keyring = ["dep:keyring"]

# Dev/test
devtools = ["tauri/devtools"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
incremental = false
