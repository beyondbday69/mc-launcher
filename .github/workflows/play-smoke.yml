name: play-smoke

# Real Headless End-to-End Execution & Screen Recording:
#   1. Build Rust CLI engine binaries: `install-cli` and `launch-cli`.
#   2. Start Xvfb (1280x720 16:9 HD display).
#   3. Start ffmpeg screen recording (x11grab).
#   4. Use `install-cli` to download real Minecraft 1.21.4 + Fabric Loader from Mojang & Fabric servers.
#   5. Use `launch-cli` to spawn real Minecraft Java Edition (LWJGL, Mesa software OpenGL).
#   6. Interact with the live game using xdotool (menus, options, F3 HUD).
#   7. Capture in-game screenshot & runtime telemetry.
#   8. Encode real gameplay video (.mp4, .webm, .gif).
#   9. Upload artifacts, push to media branch, and render in GitHub Actions Summary.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  play-smoke-linux:
    name: real minecraft 1.21 execution & gameplay recording
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenJDK 21
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-21-jre-headless
          /usr/lib/jvm/java-21-openjdk-amd64/bin/java -version
          echo "JAVA=/usr/lib/jvm/java-21-openjdk-amd64/bin/java" >> "$GITHUB_ENV"

      - name: Install Xvfb + GTK/WebKit dev + recording & window tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config xvfb imagemagick x11-utils x11-apps libxi6 libxtst6 \
            libnss3 libxss1 libasound2 libatk1.0-0 libatk-bridge2.0-0 \
            libdrm2 libxkbcommon0 libgbm1 libpango-1.0-0 libpangocairo-1.0-0 \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev xdotool ffmpeg xterm fluxbox

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-play-smoke-registry-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-play-smoke-registry-

      - name: Build install-cli and launch-cli executables
        working-directory: src-tauri
        env:
          MC_LAUNCHER_JAVA: ${{ env.JAVA }}
        run: |
          set -e
          cargo build --bin install-cli --bin launch-cli
          # Sanity check: confirm CLI binaries are compiled
          ls -la target/debug/install-cli target/debug/launch-cli

      - name: Start Xvfb on :99 (1280x720 HD)
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID"
          for i in 1 2 3 4 5; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb is ready on :99"
              break
            fi
            sleep 1
          done

      - name: Run Real Minecraft 1.21.4 Download, Launch, and Gameplay Screen Recording
        run: |
          chmod +x scripts/record-real-gameplay.sh
          ./scripts/record-real-gameplay.sh

      - name: Upload real gameplay video recordings
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-121-real-gameplay-video
          path: |
            /tmp/real_minecraft_121_launch.mp4
            /tmp/real_minecraft_121_launch.webm
            /tmp/real_minecraft_121_launch.gif
          if-no-files-found: error
          retention-days: 14

      - name: Upload game screenshots
        uses: actions/upload-artifact@v4
        with:
          name: play-smoke-screenshots
          path: |
            /tmp/play-smoke.png
            /tmp/play-smoke-hud.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload performance stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-smoke-stats
          path: |
            /tmp/play-smoke-stats.json
            /tmp/play-smoke-stats.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload launch-cli log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-smoke-log
          path: |
            /tmp/launch-cli.log
            /tmp/ffmpeg_record.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Display Real Gameplay Video, Screenshots & Telemetry in Actions Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEMP_DIR=$(mktemp -d)
          cp /tmp/real_minecraft_121_launch.* "$TEMP_DIR/" 2>/dev/null || true
          cp /tmp/play-smoke*.png "$TEMP_DIR/" 2>/dev/null || true
          cd "$TEMP_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b media
          git add *
          git commit -m "chore(media): update real Minecraft 1.21 execution video and screenshots for run ${{ github.run_id }}" || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin media --force || echo "Warning: push to media branch failed"
          cd "$GITHUB_WORKSPACE"

          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          BASE="https://raw.githubusercontent.com/${REPO}/media"

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🎮 Real Minecraft 1.21.4 Execution & Gameplay Recording

          Real Minecraft Java Edition 1.21.4 was downloaded and launched directly in GitHub Actions using our custom launcher engine (`install-cli` and `launch-cli`).
          The entire execution (downloading assets from Mojang/Fabric, spawning Java 21, loading LWJGL OpenGL window, interacting with menus via xdotool) was recorded live under Xvfb.

          ---

          ### 🎬 Real Gameplay & Execution Preview
          EOF

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ![Real Minecraft 1.21 Gameplay Preview](${BASE}/real_minecraft_121_launch.gif?v=${RUN_ID})

          ---

          ### 📥 Download Gameplay Video
          - 🎬 **MP4 Video (H.264 / 1280x720 HD)**: [Download real_minecraft_121_launch.mp4](${BASE}/real_minecraft_121_launch.mp4)
          - 🎥 **WebM Video (VP9 / 1280x720 HD)**: [Download real_minecraft_121_launch.webm](${BASE}/real_minecraft_121_launch.webm)
          - 🎞️ **Animated GIF**: [View real_minecraft_121_launch.gif](${BASE}/real_minecraft_121_launch.gif)

          ---

          ### 📸 In-Game Screenshot (LWJGL under Xvfb)
          ![Minecraft 1.21 In-Game Screenshot](${BASE}/play-smoke.png?v=${RUN_ID})

          EOF

          if [ -f /tmp/play-smoke-stats.md ]; then
            cat /tmp/play-smoke-stats.md >> $GITHUB_STEP_SUMMARY
          fi
