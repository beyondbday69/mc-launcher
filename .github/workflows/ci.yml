name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-core:
    name: core (no tauri, fast)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Install OpenJDK 21
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-21-jre-headless
          /usr/lib/jvm/java-21-openjdk-amd64/bin/java -version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-core-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
      - name: Check
        working-directory: core
        run: cargo check --all-targets
      - name: Test
        working-directory: core
        env:
          # Tell the real end-to-end test where to find a real JVM.
          MC_E2E_JAVA: /usr/lib/jvm/java-21-openjdk-amd64/bin/java
        run: cargo test --all --no-fail-fast
      - name: Release build
        working-directory: core
        run: cargo build --release --lib
      - name: Clippy (informational)
        working-directory: core
        run: cargo clippy --all-targets --message-format=short 2>&1 | tail -40 || true

  backend-tauri-linux:
    name: tauri shell (linux)
    runs-on: ubuntu-22.04
    needs: backend-core
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: npm ci
        run: npm ci || npm install
      - name: Build frontend
        run: npm run build
      - name: cargo check (bin)
        working-directory: src-tauri
        run: cargo check --bins
      - name: cargo build (bin, debug)
        working-directory: src-tauri
        run: cargo build --bins
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all --no-fail-fast

  backend-tauri-windows:
    name: tauri shell (windows)
    runs-on: windows-2022
    needs: backend-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: npm ci
        run: npm ci || npm install
      - name: Build frontend
        run: npm run build
      - name: cargo check (bin)
        working-directory: src-tauri
        shell: bash
        run: cargo check --bins
      - name: cargo build (bin, debug)
        working-directory: src-tauri
        shell: bash
        run: cargo build --bins
      - name: cargo test
        working-directory: src-tauri
        shell: bash
        run: cargo test --all --no-fail-fast

  frontend:
    name: frontend (ts + vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install (skip if no lockfile yet)
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
      - run: npx tsc --noEmit
      - run: npx vitest run --reporter=basic || echo "vitest not configured, skipping"
      - run: npm run build || true

  release-windows:
    name: tauri release build (windows .exe)
    runs-on: windows-2022
    needs: [backend-core, backend-tauri-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: Install tauri CLI
        shell: bash
        run: cargo install tauri-cli --version '^2.0' --locked
      - name: npm ci
        shell: bash
        run: npm ci
      - name: Build frontend
        shell: bash
        run: npm run build
      - name: tauri build (no bundle, raw .exe)
        shell: bash
        run: npx tauri build --no-bundle
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mc-launcher-windows
          path: src-tauri/target/release/mc-launcher.exe
          if-no-files-found: error
          retention-days: 14
