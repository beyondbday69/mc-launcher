name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-core:
    name: core (no tauri, fast)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Install OpenJDK 21
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-21-jre-headless
          /usr/lib/jvm/java-21-openjdk-amd64/bin/java -version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-core-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
      - name: Check
        working-directory: core
        run: cargo check --all-targets
      - name: Test
        working-directory: core
        env:
          # Tell the real end-to-end test where to find a real JVM.
          MC_E2E_JAVA: /usr/lib/jvm/java-21-openjdk-amd64/bin/java
        run: cargo test --all --no-fail-fast
      - name: Release build
        working-directory: core
        run: cargo build --release --lib
      - name: Clippy (informational)
        working-directory: core
        run: cargo clippy --all-targets --message-format=short 2>&1 | tail -40 || true

  backend-tauri-linux:
    name: tauri shell (linux)
    runs-on: ubuntu-22.04
    needs: backend-core
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: npm ci
        run: npm ci || npm install
      - name: Build frontend
        run: npm run build
      - name: cargo check (bin)
        working-directory: src-tauri
        run: cargo check --bins
      - name: cargo build (bin, debug)
        working-directory: src-tauri
        run: cargo build --bins
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all --no-fail-fast

  backend-tauri-windows:
    name: tauri shell (windows)
    runs-on: windows-2022
    needs: backend-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: npm ci
        run: npm ci || npm install
      - name: Build frontend
        run: npm run build
      - name: cargo check (bin)
        working-directory: src-tauri
        shell: bash
        run: cargo check --bins
      - name: cargo build (bin, debug)
        working-directory: src-tauri
        shell: bash
        run: cargo build --bins
      - name: cargo test
        working-directory: src-tauri
        shell: bash
        run: cargo test --all --no-fail-fast

  frontend:
    name: frontend (ts + vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install (skip if no lockfile yet)
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
      - run: npx tsc --noEmit
      - run: npx vitest run --reporter=basic || echo "vitest not configured, skipping"
      - run: npm run build || true

  release-windows:
    name: tauri release build (windows .exe)
    runs-on: windows-2022
    needs: [backend-core, backend-tauri-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: Install tauri CLI
        shell: bash
        run: cargo install tauri-cli --version '^2.0' --locked
      - name: npm ci
        shell: bash
        run: npm ci
      - name: Build frontend
        shell: bash
        run: npm run build
      - name: tauri build (no bundle, raw .exe)
        shell: bash
        run: npx tauri build --no-bundle
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mc-launcher-windows
          path: src-tauri/target/release/mc-launcher.exe
          if-no-files-found: error
          retention-days: 14

  tauri-linux-smoke:
    name: tauri linux smoke (xvfb + screenshot)
    runs-on: ubuntu-22.04
    needs: backend-tauri-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb + screenshot tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config xvfb imagemagick x11-utils x11-apps libxi6 libxtst6 \
            libnss3 libxss1 libasound2 libatk1.0-0 libatk-bridge2.0-0 \
            libdrm2 libxkbcommon0 libgbm1 libpango-1.0-0 libpangocairo-1.0-0 \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Restore debug binary from cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Same key as backend-tauri-linux so we share the populated cache.
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci
        run: npm ci || npm install
      # `tauri::generate_context!()` validates the frontendDist path at
        # compile time, so we must rebuild the frontend before re-running
        # `cargo build --bins`. The cache key above covers target/, not
        # dist/, so this step is cheap when nothing changed.
      - name: Build frontend
        run: npm run build
      - name: Rebuild debug binary
        working-directory: src-tauri
        # `cargo build` is a no-op when the cache hit means the binary is
        # already up to date. We run it explicitly to guarantee the binary
        # exists in case the cache miss path was taken.
        run: cargo build --bins
      # Pre-populate a real install in an isolated data dir so the GUI
      # screenshot below shows the installed instance on the home
      # screen, not an empty launcher. Uses the same mc_launcher code
      # the Tauri commands call, just driven by CLI args.
      - name: Pre-install Minecraft 1.21.4 + Fabric (headless)
        working-directory: src-tauri
        env:
          # Force both this CLI and the GUI below to use the same data
          # dir so the instance we create here is visible to the GUI.
          XDG_DATA_HOME: /tmp/launcher-smoke-data
        run: |
          set -e
          # Pick the latest fabric loader version dynamically from the
          # live API so we don't pin to a version that Mojang / Fabric
          # have EOL'd by the time CI runs.
          LOADER=$(curl -sS "https://meta.fabricmc.net/v2/versions/loader/1.21.4" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['loader']['version'])")
          echo "Using Fabric loader: $LOADER"
          ./target/debug/install-cli \
            --version 1.21.4 \
            --fabric "$LOADER" \
            --instance-name smoke-1-21-4
      - name: Start Xvfb on :99
        run: |
          Xvfb :99 -screen 0 1280x800x24 -ac &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID"
          # Give Xvfb a moment to come up.
          for i in 1 2 3 4 5; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb is up"
              break
            fi
            sleep 1
          done
      - name: Launch Tauri app under Xvfb
        env:
          DISPLAY: :99
          # Disable dmabuf renderer in WebKitGTK so it works without a
          # real GPU under Xvfb.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # Force software GL so the WebView renders at all on headless.
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Use the same data dir as the install step so the GUI sees
          # the pre-installed 'smoke-1-21-4' instance.
          XDG_DATA_HOME: /tmp/launcher-smoke-data
        run: |
          set +e
          # Start the app in the background, capture PID + logs.
          src-tauri/target/debug/mc-launcher >/tmp/tauri.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID"
          # Wait up to 30s for the window to appear (xdotool/wmctrl would
          # be nicer, but we don't want to add more deps — poll the log).
          for i in $(seq 1 30); do
            sleep 1
            if [ -s /tmp/tauri.log ]; then
              # App has produced some output -> the main loop is running.
              if grep -qi "ready\|started\|listening\|main" /tmp/tauri.log; then
                echo "App appears to be running (log activity)"
                break
              fi
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "App exited early!"
              echo "--- tauri.log ---"
              cat /tmp/tauri.log
              exit 1
            fi
          done
          # Give the WebView a few more seconds to paint the home
          # screen with the installed instance visible.
          sleep 5
          echo "Capturing screenshot"
          import -window root /tmp/launcher.png
          ls -la /tmp/launcher.png
          # Stop the app cleanly.
          kill "$APP_PID" 2>/dev/null || true
          sleep 1
          kill -9 "$APP_PID" 2>/dev/null || true
          echo "--- tauri.log (last 40 lines) ---"
          tail -40 /tmp/tauri.log || true
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-smoke-with-install
          path: /tmp/launcher.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload tauri log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-smoke-log
          path: /tmp/tauri.log
          if-no-files-found: ignore
          retention-days: 7
