name: sscap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  capture-all-screens:
    name: capture all screens (fast web preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server & capture all screens
        run: |
          npm run preview -- --port 4173 &
          PREVIEW_PID=$!
          echo "Waiting for preview server on http://localhost:4173..."
          for i in {1..30}; do
            if curl -s http://localhost:4173 >/dev/null; then
              echo "Preview server is ready!"
              break
            fi
            sleep 1
          done
          mkdir -p /tmp/screenshots
          node scripts/capture-all-screens.mjs
          kill $PREVIEW_PID || true

      - name: Upload all screen screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sscap-all-screens
          path: /tmp/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
