name: sscap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  capture-all-screens:
    name: capture all screens (fast web preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server & capture all screens
        run: |
          npm run preview -- --port 4173 &
          PREVIEW_PID=$!
          echo "Waiting for preview server on http://localhost:4173..."
          for i in {1..30}; do
            if curl -s http://localhost:4173 >/dev/null; then
              echo "Preview server is ready!"
              break
            fi
            sleep 1
          done
          mkdir -p /tmp/screenshots
          node scripts/capture-all-screens.mjs
          kill $PREVIEW_PID || true

      - name: Upload all screen screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sscap-all-screens
          path: /tmp/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Display screenshots directly in Actions Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Push screenshots to orphan 'screenshots' branch for fast raw CDN hosting
          TEMP_DIR=$(mktemp -d)
          cp /tmp/screenshots/*.png "$TEMP_DIR/"
          cd "$TEMP_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b screenshots
          git add *.png
          git commit -m "chore(screenshots): update screenshots for run ${{ github.run_id }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin screenshots --force || echo "Warning: git push to screenshots branch failed, continuing..."
          cd "$GITHUB_WORKSPACE"

          # 2. Append markdown gallery to $GITHUB_STEP_SUMMARY
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          BASE="https://raw.githubusercontent.com/${REPO}/screenshots"

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 📸 Live Screen Previews (HeroUI v3 Solid Black)

          Screenshots captured directly inside this GitHub Actions run:

          EOF

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 1. Home Screen
          ![01-home](${BASE}/01-home.png?v=${RUN_ID})

          ---

          ### 2. Instances Screen
          ![02-instances](${BASE}/02-instances.png?v=${RUN_ID})

          ---

          ### 3. Versions Catalog
          ![03-versions](${BASE}/03-versions.png?v=${RUN_ID})

          ---

          ### 4. Downloads & Queue
          ![04-downloads](${BASE}/04-downloads.png?v=${RUN_ID})

          ---

          ### 5. Content & Mods
          ![05-content](${BASE}/05-content.png?v=${RUN_ID})

          ---

          ### 6. Settings (HeroUI v3 Capsule Slider & Pill Knob)
          ![06-settings](${BASE}/06-settings.png?v=${RUN_ID})

          ---

          ### 7. MorphSlider WebGL Demo (OGL + GSAP Melt Transitions)
          ![07-morph-slider](${BASE}/07-morph-slider.png?v=${RUN_ID})
          EOF
